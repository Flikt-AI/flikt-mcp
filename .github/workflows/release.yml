name: Publish to PyPI

# Fires when you publish a GitHub Release. Builds the sdist+wheel and uploads
# to PyPI via Trusted Publishing (OIDC) — no API token is stored anywhere.
# PyPI must have a Trusted Publisher configured for this repo + this workflow
# (Settings → Publishing on the project, owner=Flikt-AI repo=flikt-mcp
# workflow=release.yml). See README → "Releasing".

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC); nothing else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
