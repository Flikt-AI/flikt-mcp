[project]
name = "flikt-mcp"
version = "0.2.0"
description = "MCP server for Flikt.AI — browse plan-review results, ask questions, export RFIs, and start reviews from Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Flikt.AI" }]
keywords = ["mcp", "claude", "flikt", "construction", "plan-review", "coordination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://flikt.ai"
Repository = "https://github.com/Flikt-AI/flikt-mcp"

[project.scripts]
flikt-mcp = "flikt_mcp.server:main"

# Hosted (mcp.flikt.ai) mode: validates Clerk OAuth JWTs. Local stdio mode
# (FLIKT_API_TOKEN) needs none of this — flikt_mcp.auth is imported lazily.
[project.optional-dependencies]
remote = ["pyjwt[crypto]>=2.8,<3"]
# ruff is pinned EXACTLY, not floored. A linter is a gate, and a floor means
# CI silently adopts whatever ruff released this morning — new rules, changed
# fixes, and a red build nobody asked for. Bumping it is a deliberate commit.
# (It was `ruff>=0.4`, which is why the E402 suppressions below had gone dead
# without anyone noticing.) pytest/pytest-asyncio stay floored on purpose:
# they are not gates, and a new pytest does not invent new failures.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff==0.15.15", "pyjwt[crypto]>=2.8,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flikt_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Explicit, because ruff's DEFAULT set is only E4/E7/E9/F — so before this,
# `ruff check .` in CI could not see a single one of the 20 findings this
# repo actually had (12 non-PEP-604 annotations, 6 dead noqa directives,
# 2 blind excepts). Fixing them without enabling the rules would have left
# nothing to stop them coming straight back.
#
# Deliberately NOT enabled, measured rather than guessed:
#   ARG (10 findings) — unused arguments, all in test fakes and protocol
#       stubs where the signature is dictated by the interface being mocked.
#       Noise, not defects.
#   E501 (1 finding)  — one 118-char line in tests/test_client.py. Enabling
#       full `E` for it means adopting every other pycodestyle rule too;
#       `line-length` above already documents the intent.
# Add a family here only with the count in hand.
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "BLE"]
