[project]
name = "flikt-mcp"
version = "0.2.0"
description = "MCP server for Flikt.AI — browse plan-review results, ask questions, export RFIs, and start reviews from Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Flikt.AI" }]
keywords = ["mcp", "claude", "flikt", "construction", "plan-review", "coordination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://flikt.ai"
Repository = "https://github.com/Flikt-AI/flikt-mcp"

[project.scripts]
flikt-mcp = "flikt_mcp.server:main"

# Hosted (mcp.flikt.ai) mode: validates Clerk OAuth JWTs. Local stdio mode
# (FLIKT_API_TOKEN) needs none of this — flikt_mcp.auth is imported lazily.
[project.optional-dependencies]
remote = ["pyjwt[crypto]>=2.8,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "pyjwt[crypto]>=2.8,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flikt_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
