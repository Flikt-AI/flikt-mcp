[project]
name = "flikt-mcp"
version = "0.2.0"
description = "MCP server for Flikt.AI — browse plan-review results, ask questions, export RFIs, and start reviews from Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Flikt.AI" }]
keywords = ["mcp", "claude", "flikt", "construction", "plan-review", "coordination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://flikt.ai"
Repository = "https://github.com/Flikt-AI/flikt-mcp"

[project.scripts]
flikt-mcp = "flikt_mcp.server:main"

# Hosted (mcp.flikt.ai) mode: validates Clerk OAuth JWTs. Local stdio mode
# (FLIKT_API_TOKEN) needs none of this — flikt_mcp.auth is imported lazily.
[project.optional-dependencies]
remote = ["pyjwt[crypto]>=2.8,<3"]
# ruff is PINNED EXACTLY, not floored. CI runs `ruff check .` against whatever
# `pip install -e ".[dev]"` resolves, so under the old `ruff>=0.4` the linter
# silently upgraded between runs and its DEFAULT RULE SET moved with it: the
# last green run on main was 2026-06-14, and the identical tree fails today
# with 20 findings (12 UP045, 6 RUF100, 2 BLE001) on lines nobody has touched
# since. A build that turns red with no code change is not a signal, and it
# lands on whichever PR happens to be open next. A linter is a tool, not a
# dependency — pin it and upgrade it deliberately.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff==0.15.15", "pyjwt[crypto]>=2.8,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flikt_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
